<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cá Con Vượt Đại Dương - Học Tập</title>
    <link rel="stylesheet" href="style.css">
    <!-- Thư viện bắn pháo hoa khi thắng -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <!-- Màn hình chính của Game -->
    <div class="game-wrapper">
        <!-- Khu vực vẽ đồ họa chuyển động chuyển cảnh của Cá -->
        <canvas id="gameCanvas" width="800" height="400"></canvas>

        <!-- Hộp câu hỏi trắc nghiệm (Mặc định ẩn, chỉ hiện khi chạm chướng ngại vật) -->
        <div id="quiz-box" class="quiz-container" style="display: none;">
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <h2 id="question">Câu hỏi trắc nghiệm?</h2>
            <div class="options-container" id="options-container"></div>
        </div>

        <!-- Màn hình kết thúc/Bắt đầu lại -->
        <div id="end-screen" class="end-container" style="display: none;">
            <h1 id="end-title">Chúc mừng bạn!</h1>
            <p id="end-score"></p>
            <button id="restart-btn" onclick="resetGame()">Chơi lại từ đầu</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
